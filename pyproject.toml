[project]
name = "agentic-workflows"
version = "0.1.1"
description = "Generic agent skills for standardized session workflows, configured per project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "skills/*/LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aw = "aw.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aw"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "aw/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
