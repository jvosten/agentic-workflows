# Every key a project can set in .agents/aw.toml.
#
# type:    str | bool | list | choice | table (string values)
# ask:     aw init prompts for it (others are set with --set or by editing)
# when:    ask only if these keys already have these values
# detect:  name of a detector in init.py that proposes the default
# default: fallback when nothing else sets the key
#
# Placeholders, expanded when read: {project} {repo_parent} everywhere;
# {type} {slug} {n} {date} {issue} in branch_name, worktree_name, on_start ({issue} empty without one);
# {issue} {status} {status_name} in on_issue_status; {pr} {final} {issue} {slug} {type} {date} in on_merge.
# {n} is the session number, counted per clone and never committed.

version = 1

# Old key = new key. Config files that still use the old name keep working; aw init rewrites them.
[renamed]
on_issue_start = "on_start"

[keys.main_branch]
type = "str"
ask = true
detect = "main_branch"
default = "main"
help = "Branch that sessions start from and merge into"

[keys.forge]
type = "choice"
choices = ["github", "gitlab", "none"]
ask = true
detect = "forge"
default = "none"
help = "Where pull/merge requests live (none: merge by hand, aw finish only cleans up)"

[keys.tracker]
type = "choice"
choices = ["github", "gitlab", "jira", "none"]
ask = true
detect = "forge"
default = "none"
help = "Issue tracker"

[keys.jira_base_url]
type = "str"
ask = true
when = { tracker = "jira" }
default = ""
help = "Jira site URL, e.g. https://your-org.atlassian.net (credentials: JIRA_USER_EMAIL, JIRA_API_TOKEN, optional JIRA_CLOUD_ID)"

[keys.jira_project]
type = "str"
ask = true
when = { tracker = "jira" }
default = ""
help = "Jira project key for new issues and open-issue lists"

[keys.jira_fields]
type = "table"
default = {}
help = "Extra Jira fields shown by aw issue view, name = field id (e.g. acceptance_criteria = \"customfield_10000\")"

[keys.subtask_type]
type = "str"
ask = true
when = { tracker = "jira" }
default = ""
help = "Issue type for subtasks created from a plan (empty: the tracker default)"

[keys.github_project]
type = "str"
ask = true
when = { tracker = "github" }
default = ""
help = "GitHub Projects board whose status field follows the issue status, as owner/number (empty: none)"

[keys.status_field]
type = "str"
default = "Status"
help = "Single-select field of github_project that holds the column"

[keys.status_map]
type = "table"
default = {}
help = "Canonical status (backlog, ready, in_progress, in_review, done) = tracker or board status name"

[keys.sync_issue_status]
type = "bool"
default = true
help = "aw start-task moves the issue to in_progress (only from backlog or ready) and aw finish to done (Jira, or GitHub with github_project)"

[keys.epic_types]
type = "list"
default = ["Epic"]
help = "Issue types above story level: a parent rollup never moves or closes them (Jira: also any type above story level; GitHub board: also a card without a column)"

[keys.instructions_file]
type = "str"
ask = true
detect = "instructions_file"
default = "AGENTS.md"
help = "Agent instructions file, relative to the repo root"

[keys.direnv]
type = "bool"
ask = true
detect = "direnv"
default = false
help = "Give each worktree an .envrc that delegates to the primary checkout"

[keys.verify_cmd]
type = "str"
ask = true
detect = "verify_cmd"
default = ""
help = "Command that validates a change before commit (empty: none)"

[keys.changelog_file]
type = "str"
ask = true
detect = "changelog_file"
default = ""
help = "Changelog that aw-finalize adds an entry to (empty: none)"

[keys.merge_method]
type = "choice"
choices = ["merge", "squash", "rebase"]
ask = true
default = "merge"
help = "How aw finish merges the pull/merge request"

[keys.mr_template]
type = "str"
default = ""
help = "Forge merge request template by name: .gitlab/merge_request_templates/<name>.md or .github/PULL_REQUEST_TEMPLATE/<name>.md (empty: GitLab's Default, GitHub's pull_request_template.md, else the bundled one)"

[keys.contributing_file]
type = "str"
default = "CONTRIBUTING.md"
help = "Contribution rules (commit style, merge request title and sections, labels, reviewers); they win over the template"

[keys.merge_gate]
type = "choice"
choices = ["approve", "auto"]
ask = true
default = "approve"
help = "approve: aw-finalize stops at the green pull request and waits for your go; auto: it merges once CI and review are green"

[keys.backlog_home]
type = "choice"
choices = ["tracker", "file"]
ask = true
when = { tracker = "!none" }
default = "tracker"
help = "Where deferred work lives: tracker (backlog_file is a session inbox, emptied by aw-finalize) or file (backlog_file is the backlog)"

[keys.backlog_file]
type = "str"
default = "BACKLOG.md"
help = "Backlog file, relative to the repo root: the backlog itself, or the session inbox when backlog_home = tracker"

[keys.backlog_parent]
type = "str"
default = ""
help = "Default parent for backlog items pushed to the tracker; the skill offers its children too (empty: ask each time)"

[keys.backlog_type]
type = "str"
default = ""
help = "Issue type for backlog items pushed to the tracker (empty: the tracker default)"

[keys.memory_dir]
type = "str"
default = ".agents/memory"
help = "Directory with the project's committed memory: decisions/, gotchas/ (one file per entry) and tags.toml"

[keys.gotchas_load]
type = "choice"
choices = ["full", "tags"]
default = "full"
help = "What a session start loads: full (every active gotcha) or tags (the tag list; plans pull matching gotchas)"

[keys.definition_of_done]
type = "str"
default = ""
help = "File with the team's definition of done, cited by plans and subtasks (empty: none)"

[keys.subagent_model]
type = "str"
default = ""
help = "Model that skills name when they delegate mechanical steps to a subagent (empty: none)"

[keys.templates]
type = "table"
default = {}
help = "Document templates that override the bundled ones, name = path from the repo root (story, subtask, plan)"

[keys.plan_dir]
type = "str"
default = ".agents/plans"
help = "Directory with plan documents, relative to the repo root"

[keys.plan_scope]
type = "choice"
choices = ["repo", "local"]
default = "repo"
help = "repo: plans are committed with the work; local: gitignored, kept in the primary checkout for this clone only"

[keys.plan_file]
type = "str"
default = "{area}/{issue}-{slug}-{date}.md"
help = "Plan file path under plan_dir; placeholders {issue} {slug} {date} {parent} {parent_slug} {area} ({parent}-{parent_slug}; empty without a parent, and the folder drops out)"

[keys.branch_types]
type = "list"
default = ["feat", "fix", "chore", "docs", "refactor"]
help = "Allowed branch prefixes (conventional commit types)"

[keys.branch_name]
type = "str"
default = "{type}/{slug}-{date}"
help = "Branch name pattern"

[keys.worktree_root]
type = "str"
default = "{repo_parent}/{project}.worktrees"
help = "Directory that holds session worktrees"

[keys.worktree_name]
type = "str"
default = "s{n}-{slug}"
help = "Worktree directory name pattern"

[keys.on_start]
type = "str"
default = ""
help = "Shell command run in the new worktree after every session start, e.g. worktree setup: direnv exec . uv sync"

[keys.on_merge]
type = "str"
default = ""
help = "Shell command run in the primary checkout after every merge (aw merge and aw finish), e.g. flux reconcile source git flux-system; {pr} {issue} {slug} {type} {date}, {final} = true on the last one"

[keys.on_issue_status]
type = "str"
default = ""
help = "Shell command run after an issue changes status (aw issue set-status, start-task, finish), e.g. a board move: scripts/board-sync.sh {issue} {status_name}"

[keys.pr_close_keyword]
type = "str"
default = "Fixes"
help = "Keyword that links a PR to the issue it closes"
