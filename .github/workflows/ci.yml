name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions: pinned commits; Dependabot bumps them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]  # the requires-python floor and the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest  # tests set their own git identity (tests/conftest.py)

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src tests

  packaged:
    name: packaged install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"  # the requires-python floor
      # Not editable, from git: the skills must come from the package (aw/_skills), not from this checkout.
      - run: |
          uv tool install "git+file://$GITHUB_WORKSPACE@$(git rev-parse HEAD)"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: aw install links the packaged skills
        working-directory: ${{ runner.temp }}  # outside any repo: aw doctor checks the install only
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          test "$(aw --version)" = "aw $(grep -m1 '^version' "$GITHUB_WORKSPACE/pyproject.toml" | cut -d'"' -f2)"
          aw install
          expected=$(find "$GITHUB_WORKSPACE/skills" -name SKILL.md | wc -l)
          test "$(find "$HOME/.claude/skills/" -mindepth 2 -maxdepth 2 -name SKILL.md -follow | wc -l)" = "$expected"
          target=$(readlink -f "$HOME/.claude/skills/aw-finalize")
          case "$target" in */aw/_skills/aw-finalize) ;; *) echo "aw-finalize links to $target"; exit 1 ;; esac
          aw doctor
